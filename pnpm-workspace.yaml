allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
overrides:
  # Security patches for Express's transitive request parsers.
  'qs': 6.16.0
  'body-parser': 2.3.0
  # Patch Prisma configuration for GHSA-ggr8-5vv4-36mx (recursive merge DoS).
  'deepmerge-ts': 8.0.0
  # Patch Prisma's MySQL tooling for credential disclosure and decompression DoS.
  'mysql2': 3.23.1
  # Patch transitive @hono/node-server (via @prisma/dev) for GHSA-92pp-h63x-v22m
  # (serveStatic middleware bypass via repeated slashes). Not used by the app
  # itself; only ships inside Prisma's local dev tooling.
  '@hono/node-server': ^1.19.13
  # Patch transitive on-headers (the 1.0.2 copy via morgan) for GHSA-76c9-3jph-rj3q
  # (HTTP response header manipulation). compression/express-session already use
  # 1.1.0; this dedupes morgan's copy onto the patched line.
  'on-headers': ^1.1.0
  # Patch transitive shell-quote (via concurrently, dev-only) for GHSA-w7jw-789q-3m8p
  # (quote() does not escape newlines in object .op values).
  'shell-quote': ^1.8.4
